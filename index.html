<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#e6d6c6;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:.09;mix-blend-mode:overlay;image-rendering:pixelated}
#hideV{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;background:linear-gradient(90deg,#000 0,#000 30%,transparent 38%,transparent 62%,#000 70%,#000 100%)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;background:radial-gradient(ellipse at 50% 40%,rgba(70,5,5,.85),#000 75%);z-index:9;text-align:center;padding:16px;overflow:auto}
.ov.h{display:none}.ov,.ov *{touch-action:pan-y}#noteB,#bagB,#infoB,#tgB{position:sticky;bottom:8px;z-index:2}@media (max-height:520px){#note .paper{font-size:14px;padding:14px 18px;line-height:1.45}}.ov>*{flex-shrink:0}.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
h1{font-size:clamp(34px,8vw,74px);letter-spacing:.14em;color:#b10e0e;margin:0;text-shadow:0 0 30px #700,0 3px 0 #300;font-weight:900}
h2{margin:0;color:#c9a46a;font-weight:normal;letter-spacing:.3em;font-size:clamp(12px,2.4vw,18px)}
button{background:linear-gradient(#2a0d0d,#140606);color:#ecd9c4;border:1px solid #7a2a22;padding:10px 22px;font:inherit;font-size:16px;min-width:220px;border-radius:3px;cursor:pointer;letter-spacing:.05em}
button:hover{border-color:#c33;color:#fff}button:active{background:#500}
p{max-width:600px;font-size:14px;line-height:1.55;margin:4px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud.h{display:none}
#top{position:absolute;top:10px;left:64px;font-size:14px;text-shadow:0 0 5px #000,0 0 2px #000;line-height:1.45}
#top b{color:#d33}
#eye{position:absolute;top:8px;left:10px;width:44px;height:70px}
#bars{position:absolute;top:84px;left:10px;width:120px;font-size:10px;letter-spacing:.1em}
.bar{height:5px;background:#0009;border:1px solid #fff2;margin:2px 0 6px}.bar i{display:block;height:100%;background:#d8c39a}
#prompt{position:absolute;top:60%;width:100%;text-align:center;font-size:17px;color:#ffd9a0;text-shadow:0 0 6px #000}
#toast{position:absolute;top:20%;width:100%;text-align:center;font-size:18px;text-shadow:0 0 8px #000;padding:0 20px;transition:opacity .4s}
#inv{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
#inv span{width:48px;height:48px;border:1px solid #8a6a4a;background:rgba(10,5,3,.6);font-size:24px;display:flex;align-items:center;justify-content:center;border-radius:3px;position:relative}
#inv span small{position:absolute;bottom:1px;right:3px;font-size:10px}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px}
#cross:before,#cross:after{content:'';position:absolute;background:#fff9}#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#fl{position:fixed;inset:0;background:#900;opacity:0;pointer-events:none;z-index:6;transition:opacity .5s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity 1s;display:flex;align-items:center;justify-content:center;font-size:56px;color:#a11;letter-spacing:.3em;text-shadow:0 0 20px #600}
.tb{pointer-events:auto;position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(30,10,8,.55);border:1px solid #a5655a88;color:#f1dccb;font-size:11px;display:none;align-items:center;justify-content:center;text-align:center}
.touch .tb{display:flex}
.tb:active,.tb.on{background:rgba(140,20,20,.7)}
.cl{position:absolute;pointer-events:none;gap:8px;display:none;right:calc(12px + env(safe-area-inset-right,0px))}
.cl .tb{position:relative;flex:none}
.touch #clT{display:flex;top:calc(10px + env(safe-area-inset-top,0px))}
.touch #clB{display:grid;grid-template-columns:auto auto;justify-items:end;align-items:end;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#tE{width:72px;height:72px;font-size:14px}#tS{grid-column:2;font-size:10px}
#jb{position:absolute;width:120px;height:120px;border:2px solid #fff4;border-radius:50%;display:none}
.touch #jb{display:block;opacity:.55;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#jk{position:absolute;width:52px;height:52px;border-radius:50%;background:#fff5;left:34px;top:34px}
#note{background:rgba(0,0,0,.85)}
#note .paper{background:#d8c9a8 linear-gradient(#e2d4b4,#b9a47e);color:#2a1a0e;max-width:520px;padding:26px 30px;font-style:italic;font-size:17px;line-height:1.6;box-shadow:0 0 40px #000;transform:rotate(-1deg);border-radius:2px}
#bagL,#tgL{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:640px;width:100%}
#bagL div,#tgL div{border:1px solid #6a3a2a;padding:8px;background:#0007;font-size:13px;text-align:left}
.rt{max-width:600px;text-align:left;font-size:14px;line-height:1.7}
#rot{display:none;position:fixed;inset:0;z-index:20;background:#000;color:#c88;align-items:center;justify-content:center;font-size:22px;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
@media (max-height:520px){button{padding:6px 14px;min-width:170px;font-size:14px}h1{font-size:34px}.ov{gap:5px}}
#mirror{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(44vw,340px);height:76px;border:3px solid #0b0b0d;border-radius:14px;box-shadow:0 0 0 2px #444,0 4px 14px #000;z-index:7;pointer-events:none;display:none}
#bagL button{min-width:0;padding:5px 9px;font-size:12px;margin-top:5px}
.touch #clB{grid-template-columns:auto auto auto;gap:6px}#tS{grid-row:1;grid-column:1;font-size:10px}#tQ{grid-row:1;grid-column:2}#tE{grid-row:1;grid-column:3}#tC{grid-row:2;grid-column:2}#tR{grid-row:2;grid-column:3}
@media (max-height:520px){.tb{width:50px;height:50px;font-size:10px}#tE{width:60px;height:60px;font-size:13px}.cl{gap:6px}.touch #clB{bottom:calc(10px + env(safe-area-inset-bottom,0px))}}

#tgL .sec{grid-column:1/-1;border-color:#3a1a14;background:#1a0a08aa}#tgL button{min-width:0;padding:5px 9px;font-size:12px;margin:3px 3px 0 0}#tgT{max-width:640px}
