  const t=i/segCount;
  const seg=new T.Group();
  seg.position.set(0, i===0?0:-0.052, 0);
  
  /* Interlaced weave oval beads */
  const rTuck=0.034*(1-t*0.52);

  beadR.rotation.z=(i%2===0?-.3:.3);
